<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquete IoT</title>
<style>
:root{
  --papel:#f6f7f4; --tinta:#1e2830; --tinta-2:#55626c; --linha:#c5ccd1; --concreto:#e4e7ea;
  --mdf:#d8bc98; --ocre:#d58f22; --cinza:#9aa3aa;
  --luz:#ffc531; --luz-tinta:#6e4d00; --agua:#1f6fd1; --verde:#1e8a4c; --alarme:#cf3127; --calor:#e0662f;
  --fonte:Bahnschrift,"DIN Alternate","DIN Next","Roboto Condensed","Arial Narrow","Segoe UI",sans-serif;
  --traco:2px solid var(--tinta);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:18px/1.35 var(--fonte);background:var(--papel);color:var(--tinta);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--agua);outline-offset:3px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{font-stretch:semi-condensed;font-weight:600;margin:0}

/* folha: moldura dupla de prancha */
.folha{position:fixed;inset:12px;border:var(--traco);display:grid;grid-template-columns:minmax(0,1fr) 360px}
.folha::after{content:"";position:absolute;inset:4px;border:1px solid var(--tinta);pointer-events:none}

/* ---------- planta ---------- */
.planta{position:relative;min-height:0;padding:12px 8px 8px 14px;
  background-image:linear-gradient(var(--concreto) 1px,transparent 1px),linear-gradient(90deg,var(--concreto) 1px,transparent 1px);
  background-size:24px 24px;background-position:-1px -1px}
.planta svg{width:100%;height:100%;display:block}
.carimbo .nota p{margin:0 0 12px;font-size:17px;color:var(--tinta-2)}
.legenda-t{font-size:14px;fill:var(--tinta)}
.legenda-t .cod{font-weight:700}

.casa{cursor:pointer;outline:none}
.casa .moldura{fill:transparent;stroke:var(--agua);stroke-width:3;opacity:0;transition:opacity .15s}
.casa:hover .moldura,.casa:focus-visible .moldura{opacity:1}
.chamada circle{fill:var(--papel);stroke:var(--tinta);stroke-width:2.5}
.chamada text{font-size:22px;font-weight:700;text-anchor:middle;fill:var(--tinta)}
.nome{font-size:26px;font-weight:600;font-stretch:semi-condensed;fill:var(--tinta)}
.rotulo{font-size:16px;fill:var(--tinta-2)}
.rotulo-forte{font-size:17px;fill:var(--tinta);font-weight:600}
.pav{font-size:15px;font-weight:600;fill:var(--tinta-2)}

.piso-casa{fill:#efe2cf}
.saia-casa{fill:none;stroke:var(--ocre);stroke-width:3}
.piso-sobrado{fill:#eceeef}
.piso-garagem{fill:var(--concreto)}
.parede{fill:none;stroke:var(--tinta);stroke-width:7;stroke-linecap:square}
.parede-fina{fill:none;stroke:var(--tinta);stroke-width:2}
.janela{stroke:var(--papel);stroke-width:4}
.janela-linha{stroke:var(--tinta);stroke-width:1.5}
.escuridao{fill:#0f1c2b;transition:opacity .4s}
.brilho{opacity:0;transition:opacity .35s}
.brilho.on{opacity:1}
.viga{fill:#b07a45}
.led-g{fill:var(--papel);stroke:var(--tinta);stroke-width:1.5;transition:fill .3s}
.led-g.on{fill:var(--luz)}
.cone{fill:var(--verde);opacity:.08;transition:opacity .3s}
.cone.ativo{opacity:.28}
.carro{transition:transform .5s ease,opacity .5s}

/* símbolos: quadrado = carga, círculo = sensor */
.mk .fundo{fill:var(--papel);stroke:var(--tinta);stroke-width:2;transition:fill .2s}
.mk .ic{color:var(--tinta);stroke-width:2}
.mk text{font-size:14px;font-weight:700;fill:var(--tinta);text-anchor:middle}
.mk.carga.on .fundo{fill:var(--luz)}
.mk.sensor.ativo .fundo{fill:var(--cs)}
.mk.sensor.ativo .ic{color:#fff}

/* ---------- carimbo ---------- */
.carimbo{border-left:var(--traco);display:flex;flex-direction:column;min-height:0;margin:5px 5px 5px 0}
.carimbo>section{border-bottom:var(--traco);padding:14px 18px}
.carimbo>section:last-child{border-bottom:0;flex:1;overflow:auto;min-height:0}
.titulo h1{font-size:34px;line-height:1.05}
.titulo p{margin:4px 0 0;font-size:16px;color:var(--tinta-2)}
.situacao{display:grid;grid-template-columns:1fr auto;padding:0!important}
.situacao>*{padding:12px 18px}
.relogio{border-left:var(--traco);font-size:24px;font-weight:600}
.conexao{display:flex;align-items:center;gap:10px;font-size:16px}
.conexao i{width:12px;height:12px;border-radius:50%;background:var(--cinza);flex:none}
.conexao.online i{background:var(--verde)}
.conexao.demo i{background:var(--agua)}
.conexao.offline i{background:var(--alarme)}
.carimbo h3{font-size:19px;margin-bottom:6px}

/* ---------- linhas de circuito (controles) ---------- */
.circuitos{border:var(--traco)}
.circuito{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--linha)}
.circuito:first-child{border-top:0}
.circuito .simb{width:48px;height:48px;border:2px solid var(--tinta);display:grid;place-items:center;transition:background .2s}
.circuito.carga .simb{border-radius:4px}
.circuito.sensor .simb{border-radius:50%}
.circuito .simb svg{width:28px;height:28px}
.circuito.on .simb{background:var(--luz)}
.circuito.ativo .simb{background:var(--cs);border-color:var(--cs);color:#fff}
.circuito .nome-c{font-size:19px;font-weight:600;line-height:1.15}
.circuito .nome-c b{font-weight:700;color:var(--tinta-2);margin-right:6px}
.circuito .estado{font-size:17px;color:var(--tinta-2)}
.circuito.on .estado{color:var(--luz-tinta);font-weight:600}
.circuito.ativo .estado{color:var(--cs);font-weight:600}
.circuito .medida{font-size:44px;font-weight:600;line-height:1}
.circuito .extra{grid-column:2/-1;display:flex;flex-direction:column;gap:8px}
.carimbo .circuitos{border:0;margin:0 -18px}
.carimbo .circuito{padding:10px 18px}
.carimbo .circuito .simb{width:42px;height:42px}

.bt{min-height:54px;min-width:124px;padding:0 18px;border:var(--traco);border-radius:6px;background:var(--papel);font-weight:600;font-size:18px}
.bt:hover{background:var(--concreto)}
.bt:active{background:var(--tinta);color:var(--papel)}
.dupla{display:grid;grid-template-columns:1fr 1fr;border:var(--traco);border-radius:6px;overflow:hidden}
.dupla button{min-height:52px;border:0;background:var(--papel);font-weight:600}
.dupla button+button{border-left:var(--traco)}
.dupla button[aria-pressed=true]{background:var(--tinta);color:var(--papel)}

.auto{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;cursor:pointer;font-size:16px;color:var(--tinta-2)}
.auto input{position:absolute;opacity:0;pointer-events:none}
.chave{width:58px;height:30px;border:var(--traco);border-radius:15px;position:relative;background:var(--papel);transition:background .2s}
.chave::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--tinta);transition:transform .2s}
.auto input:checked+.chave{background:var(--verde);border-color:var(--verde)}
.auto input:checked+.chave::after{transform:translateX(28px);background:#fff}
.auto input:focus-visible+.chave{outline:3px solid var(--agua);outline-offset:2px}

/* régua (slider vertical) */
.regua{display:flex;flex-direction:column;align-items:center;gap:8px;border:var(--traco);padding:14px 8px 12px;min-height:0}
.regua h3{font-size:18px;text-align:center;line-height:1.15}
.regua .leitura{font-size:40px;font-weight:600;line-height:1}
.regua .sub{font-size:15px;color:var(--tinta-2);text-align:center}
.regua-trilho{position:relative;flex:1;width:56px;min-height:160px;margin-left:24px;border:var(--traco);border-radius:4px;touch-action:none;cursor:pointer;
  background:repeating-linear-gradient(to top,var(--tinta) 0 1.5px,transparent 1.5px 10%) left/12px 100% no-repeat,var(--papel)}
.regua-cheio{position:absolute;left:12px;right:0;bottom:0;transition:height .1s}
.regua-trilho.luz .regua-cheio{background:var(--luz)}
.regua-trilho.temp .regua-cheio{background:var(--calor)}
.regua-limiar{position:absolute;left:-30px;right:-8px;border-top:3px solid var(--alarme);pointer-events:none}
.regua-limiar span{position:absolute;left:0;top:-22px;font-size:14px;font-weight:700;color:var(--alarme)}
.regua-cursor{position:absolute;left:-10px;right:-10px;height:16px;margin-bottom:-8px;border-radius:3px;background:var(--tinta);outline:none}
.regua-cursor::after{content:"";position:absolute;left:30%;right:30%;top:7px;height:2px;background:var(--papel)}
.regua-cursor:focus-visible{outline:3px solid var(--agua);outline-offset:3px}
.regua small{font-size:14px;color:var(--tinta-2)}

/* ---------- alerta ---------- */
.alerta{position:fixed;left:12px;right:12px;top:12px;z-index:80;display:none;align-items:center;gap:18px;padding:14px 22px;
  background:var(--alarme);color:#fff;font-size:24px;font-weight:600}
.alerta.ativo{display:flex}
.alerta svg{width:34px;height:34px;flex:none}
.alerta .bt{margin-left:auto;background:#fff;color:var(--alarme);border-color:#fff}

/* ---------- detalhe ---------- */
.detalhe{position:fixed;inset:12px;z-index:50;background:var(--papel);border:var(--traco);display:flex;flex-direction:column}
.detalhe[hidden]{display:none}
.detalhe::after{content:"";position:absolute;inset:4px;border:1px solid var(--tinta);pointer-events:none}
.det-topo{display:flex;align-items:center;gap:22px;padding:18px 22px 14px;border-bottom:var(--traco);margin:5px 5px 0}
.voltar{display:flex;align-items:center;gap:8px;min-height:58px;padding:0 22px 0 14px;border:0;border-radius:6px;background:var(--tinta);color:var(--papel);font-weight:600;font-size:20px}
.voltar svg{width:26px;height:26px}
.det-titulo{display:flex;align-items:center;gap:14px}
.det-titulo .letra{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--tinta);display:grid;place-items:center;font-size:26px;font-weight:700}
.det-titulo h2{font-size:34px;line-height:1}
.det-titulo p{margin:4px 0 0;color:var(--tinta-2);font-size:17px}
.det-corpo{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;padding:18px 22px 20px;min-height:0;margin:0 5px 5px}
.det-visual{min-height:0}
.det-visual svg{width:100%;height:100%;display:block}
.det-controles{display:grid;gap:14px;min-height:0;overflow:auto;align-content:start}
.det-controles.com-regua{grid-template-columns:minmax(0,1fr) 170px;align-content:stretch}
.coluna{display:flex;flex-direction:column;gap:14px;min-height:0}

/* sobrado em corte */
.ceu{fill:#e3eef6;transition:fill .5s}
.chuva-on .ceu{fill:#c4ccd2}
.sol{transition:opacity .5s}
.chuva-on .sol{opacity:0}
.nuvem{opacity:0;transition:opacity .5s}
.chuva-on .nuvem{opacity:1}
.gotas line{stroke:var(--agua);stroke-width:3;stroke-linecap:round;opacity:0}
.chuva-on .gotas line{animation:cai 1s linear infinite}
@keyframes cai{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(330px);opacity:0}}
.braco{transition:transform 1.2s cubic-bezier(.4,0,.2,1)}
.braco.on{transform:translateX(150px)}
.helice{transform-box:fill-box;transform-origin:center}
.helice.on{animation:gira .5s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* simulação */
.sim-bt{min-height:48px;padding:0 16px;border:2px solid var(--agua);border-radius:6px;background:var(--papel);color:var(--agua);font-weight:600;font-size:16px}
.det-topo .sim-bt{margin-left:auto}
.sim{position:fixed;right:30px;top:110px;z-index:90;width:340px;background:var(--papel);border:var(--traco);padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:8px 8px 0 var(--concreto)}
.sim[hidden],.sim-bt[hidden]{display:none}
.sim h3{font-size:20px}
.sim p{margin:0;font-size:15px;color:var(--tinta-2)}
.sim label{display:flex;flex-direction:column;gap:4px;font-size:16px}
.sim label.chk{flex-direction:row;align-items:center;gap:10px}
.sim input[type=range]{width:100%;height:30px;accent-color:var(--tinta)}
.sim input[type=checkbox]{width:24px;height:24px;accent-color:var(--tinta)}

@media (max-width:1000px){
  body{overflow:auto}
  .folha{position:static;margin:12px;display:block}
  .planta{height:60vh}
  .carimbo{border-left:0;border-top:var(--traco)}
  .det-corpo{grid-template-columns:1fr;overflow:auto}
  .det-visual{height:45vh}
  .detalhe{overflow:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <defs>
    <radialGradient id="brilho"><stop offset="0" stop-color="#fff4c2" stop-opacity=".98"/><stop offset=".6" stop-color="#ffd257" stop-opacity=".8"/><stop offset="1" stop-color="#ffc531" stop-opacity=".4"/></radialGradient>
    <clipPath id="clip-garagem"><rect x="0" y="0" width="280" height="270"/></clipPath>
  </defs>
  <symbol id="i-lamp" viewBox="0 0 24 24"><path class="ic" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-fan" viewBox="0 0 24 24"><g class="ic"><circle cx="12" cy="12" r="1.6"/><path d="M12 10.4c0-3-1-6.4 1.6-7.2 2.6-.8 4 2.6 1.6 5.2M13.6 12c3 0 6.4-1 7.2 1.6.8 2.6-2.6 4-5.2 1.6M12 13.6c0 3 1 6.4-1.6 7.2-2.6.8-4-2.6-1.6-5.2M10.4 12c-3 0-6.4 1-7.2-1.6-.8-2.6 2.6-4 5.2-1.6"/></g></symbol>
  <symbol id="i-varal" viewBox="0 0 24 24"><path class="ic" d="M2 5h20M9 5 6 8l2 1.5V19h8V9.5L18 8l-3-3M9 5a3 3 0 0 0 6 0"/></symbol>
  <symbol id="i-sirene" viewBox="0 0 24 24"><path class="ic" d="M7 18v-6a5 5 0 0 1 10 0v6M5 21h14v-3H5zM12 2.5V5M4.2 5.7l1.6 1.6M19.8 5.7l-1.6 1.6M2 12h2M20 12h2"/></symbol>
  <symbol id="i-chuva" viewBox="0 0 24 24"><path class="ic" d="M6.5 14.5a4 4 0 0 1 .5-7.9 5.5 5.5 0 0 1 10.6 1.4 3.3 3.3 0 0 1-.6 6.5zM8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/></symbol>
  <symbol id="i-ultra" viewBox="0 0 24 24"><path class="ic" d="M3 9h4v6H3zM10.5 8.5a5 5 0 0 1 0 7M14 6a8.5 8.5 0 0 1 0 12M17.5 3.5a12 12 0 0 1 0 17"/></symbol>
  <symbol id="i-fumaca" viewBox="0 0 24 24"><path class="ic" d="M8 21c-2-2 2-4 0-6.5s2-4 0-6.5M12 21c-2-2 2-4 0-6.5s2-4 0-6.5M16 21c-2-2 2-4 0-6.5s2-4 0-6.5M5 3h14"/></symbol>
  <symbol id="i-solar" viewBox="0 0 24 24"><path class="ic" d="M3 19 6 7h12l3 12zM4.5 13h15M10 7l-1 12M14 7l1 12"/></symbol>
  <symbol id="i-voltar" viewBox="0 0 24 24"><path class="ic" d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-sol" viewBox="0 0 24 24"><g class="ic"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></symbol>
  <symbol id="i-lua" viewBox="0 0 24 24"><path class="ic" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-quente" viewBox="0 0 24 24"><path class="ic" d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0zM12 9v8"/></symbol>
  <symbol id="i-frio" viewBox="0 0 24 24"><path class="ic" d="M12 2v20M4 7l16 10M20 7 4 17M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/></symbol>
</svg>

<div class="alerta" id="alerta" role="alert">
  <svg><use href="#i-fumaca"/></svg>
  <span id="alerta-txt">Fumaça detectada.</span>
  <button class="bt" id="alerta-bt" data-set="SR" data-v="0">Silenciar sirene</button>
</div>

<main class="folha" id="vista">
  <section class="planta" aria-label="Planta baixa da maquete">
    <svg id="svg-planta" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet"></svg>
  </section>

  <aside class="carimbo">
    <section class="titulo">
      <h1>Maquete IoT</h1>
    </section>
    <section class="situacao">
      <div class="conexao" id="conexao"><i></i><span>Conectando ao ESP32</span></div>
      <div class="relogio" id="relogio">--:--</div>
    </section>
    <section>
      <h3>Alarme de incêndio</h3>
      <div class="circuitos" id="painel-incendio"></div>
    </section>
    <section class="nota">
      <p>Toque em uma construção da planta para abrir o detalhe.</p>
      <button class="sim-bt" data-abre-sim hidden>Simular sensores</button>
    </section>
  </aside>
</main>

<section class="detalhe" id="detalhe" hidden role="dialog" aria-modal="true" aria-labelledby="det-nome">
  <div class="det-topo">
    <button class="voltar" id="voltar"><svg><use href="#i-voltar"/></svg>Planta geral</button>
    <div class="det-titulo"><span class="letra" id="det-letra"></span><div><h2 id="det-nome"></h2><p id="det-desc"></p></div></div>
    <button class="sim-bt" data-abre-sim hidden>Simular sensores</button>
  </div>
  <div class="det-corpo">
    <div class="det-visual" id="det-visual"></div>
    <div class="det-controles" id="det-controles"></div>
  </div>
</section>

<div class="sim" id="sim" hidden>
  <h3>Simular sensores</h3>
  <p>A página não está ligada ao ESP32. Use estes controles para ensaiar a apresentação.</p>
  <label class="chk"><input type="checkbox" data-sim="CH"> Chuva sobre o sensor</label>
  <label class="chk"><input type="checkbox" data-sim="FU"> Fumaça no detector</label>
  <label>Distância do carro: <span data-valor="US"></span><input type="range" min="1" max="40" step="0.5" data-sim="US"></label>
  <label>Tensão do painel solar: <span data-valor="FV"></span><input type="range" min="0" max="6" step="0.1" data-sim="FV"></label>
</div>

<script>
/* =========================================================
   Configuração: nomes, limiares e dispositivos
   ========================================================= */
const LIM = { luz: 30, temp: 28, dist: 5, sirene: 3, fvMin: 0.5 };

const CASAS = {
  casa:    { letra: 'A', nome: 'Casa',    desc: 'Três cômodos com luz que acende quando o ambiente escurece' },
  sobrado: { letra: 'B', nome: 'Sobrado', desc: 'Dois pavimentos. O varal entra na lavanderia quando chove e o ventilador liga com calor' },
  garagem: { letra: 'C', nome: 'Garagem', desc: 'O sensor fica na parede oposta ao portão, de frente para o carro que entra' }
};

const DEV = {
  L1: { tipo: 'carga',  nome: 'Lâmpada do quarto',     icone: 'i-lamp' },
  L2: { tipo: 'carga',  nome: 'Lâmpada do escritório', icone: 'i-lamp' },
  L3: { tipo: 'carga',  nome: 'Lâmpada da cozinha',    icone: 'i-lamp' },
  VT: { tipo: 'carga',  nome: 'Ventilador do quarto',  icone: 'i-fan' },
  VR: { tipo: 'carga',  nome: 'Varal',                 icone: 'i-varal' },
  CH: { tipo: 'sensor', nome: 'Sensor de chuva',       icone: 'i-chuva',  cs: 'var(--agua)' },
  FV: { tipo: 'sensor', nome: 'Painel solar',          icone: 'i-solar',  cs: 'var(--verde)' },
  LG: { tipo: 'carga',  nome: 'Luz da garagem',        icone: 'i-lamp' },
  US: { tipo: 'sensor', nome: 'Sensor de distância',   icone: 'i-ultra',  cs: 'var(--verde)' },
  SR: { tipo: 'carga',  nome: 'Sirene',                icone: 'i-sirene' },
  FU: { tipo: 'sensor', nome: 'Detector de fumaça',    icone: 'i-fumaca', cs: 'var(--alarme)' }
};

/* Estado (o ESP32 devolve o mesmo formato em GET /api/estado) */
const S = {
  L1: 0, L2: 0, L3: 0, VT: 0, VR: 0, LG: 0, SR: 0,
  CH: 0, FU: 0, US: 35, FV: 4.6,
  luz: 80, temp: 24,
  aLuz: 1, aVent: 1, aVaral: 1, aGar: 1, aSir: 1
};

const fmt = (v, d = 1) => Number(v).toLocaleString('pt-BR', { maximumFractionDigits: d, minimumFractionDigits: d });
const escuro = () => S.luz < LIM.luz;
const quente = () => S.temp > LIM.temp;
const carro  = () => S.US < LIM.dist;

function sensorAtivo(id) {
  if (id === 'CH') return !!S.CH;
  if (id === 'FU') return !!S.FU;
  if (id === 'US') return carro();
  if (id === 'FV') return S.FV >= LIM.fvMin;
  return false;
}

function textoEstado(id) {
  switch (id) {
    case 'L1': case 'L2': case 'L3': case 'LG': return S[id] ? 'Acesa' : 'Apagada';
    case 'VT': return S.VT ? 'Ligado' : 'Desligado';
    case 'VR': return S.VR ? 'Recolhido' : 'Estendido';
    case 'SR': return S.SR ? 'Tocando' : 'Em silêncio';
    case 'CH': return S.CH ? 'Chovendo' : 'Seco';
    case 'FU': return S.FU ? 'Fumaça detectada' : 'Sem fumaça';
    case 'US': return carro() ? 'Carro estacionado' : 'Vaga livre';
    case 'FV': return S.FV >= LIM.fvMin ? `Gerando ${fmt(S.FV)} V` : 'Sem geração';
  }
  return '';
}

function textoAcao(id) {
  switch (id) {
    case 'VT': return S.VT ? 'Desligar' : 'Ligar';
    case 'SR': return S.SR ? 'Silenciar' : 'Tocar';
    default:   return S[id] ? 'Apagar' : 'Acender';
  }
}

function textoValor(id) {
  switch (id) {
    case 'luz': return S.luz + '%';
    case 'temp': return fmt(S.temp, 0) + ' °C';
    case 'US': return fmt(S.US) + ' cm';
    case 'FV': return fmt(S.FV) + ' V';
  }
  return '';
}

function textoSub(id) {
  switch (id) {
    case 'luz': return escuro() ? 'Escuro' : 'Claro';
    case 'temp': return quente() ? 'Quente' : 'Agradável';
    case 'US': return `Estacionado abaixo de ${LIM.dist} cm`;
  }
  return '';
}

function circuito(id, opcoes = {}) {
  const d = DEV[id];
  const acao = opcoes.semBotao || d.tipo === 'sensor' ? '' : `<button class="bt" data-toggle="${id}"></button>`;
  return `<div class="circuito ${d.tipo}" data-${d.tipo}="${id}" style="--cs:${d.cs || 'none'}">

      ${opcoes.medida ? `<div class="medida" data-valor="${id}"></div>` : ''}

    ${acao}
    ${opcoes.extra ? `<div class="extra">${opcoes.extra}</div>` : ''}

}

function autoSw(chave, texto) {
  return `<label class="auto"><input type="checkbox" data-auto="${chave}"><span class="chave"></span><span>${texto}</span></label>`;
}

const FAIXA = {
  luz:  { min: 0,  max: 100, passo: 1, titulo: 'Luz do ambiente', topo: 'i-sol',    base: 'i-lua',  lim: () => LIM.luz,  limTxt: () => `${LIM.luz}%` },
  temp: { min: 15, max: 40,  passo: 1, titulo: 'Temperatura do quarto', topo: 'i-quente', base: 'i-frio', lim: () => LIM.temp, limTxt: () => `${LIM.temp} °C` }
};

function regua(chave) {
  const f = FAIXA[chave];
  return `<div class="regua" data-vs="${chave}">
    <h3>${f.titulo}</h3>
    <span class="leitura" data-valor="${chave}"></span>
    <span class="sub" data-sub="${chave}"></span>
    <svg width="28" height="28"><use href="#${f.topo}"/></svg>
    <div class="regua-trilho ${chave}">
      <div class="regua-cheio"></div>
      <div class="regua-limiar"><span>${f.limTxt()}</span></div>
      <div class="regua-cursor" tabindex="0" role="slider" aria-label="${f.titulo}" aria-valuemin="${f.min}" aria-valuemax="${f.max}"></div>
    </div>
    <svg width="28" height="28"><use href="#${f.base}"/></svg>
  </div>`;
}

function ligarReguas(raiz) {
  raiz.querySelectorAll('[data-vs]').forEach(el => {
    const chave = el.dataset.vs, f = FAIXA[chave];
    const trilho = el.querySelector('.regua-trilho'), cursor = el.querySelector('.regua-cursor');
    const porY = y => {
      const r = trilho.getBoundingClientRect();
      const fr = Math.min(1, Math.max(0, 1 - (y - r.top) / r.height));
      definir(chave, Math.round((f.min + fr * (f.max - f.min)) / f.passo) * f.passo, true);
    };
    trilho.addEventListener('pointerdown', e => { arrastando = chave; trilho.setPointerCapture(e.pointerId); porY(e.clientY); cursor.focus({ preventScroll: true }); });
    trilho.addEventListener('pointermove', e => { if (arrastando === chave) porY(e.clientY); });
    const soltar = () => { if (arrastando === chave) { arrastando = null; definir(chave, S[chave]); } };
    trilho.addEventListener('pointerup', soltar);
    trilho.addEventListener('pointercancel', soltar);
    cursor.addEventListener('keydown', e => {
      const passo = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (!passo) return;
      e.preventDefault();
      definir(chave, Math.min(f.max, Math.max(f.min, S[chave] + passo * f.passo)));
    });
  });
}

function abrir(casa, origem) {
  casaAberta = casa;
  montarDetalhe(casa);
  detalhe.hidden = false;
  if (!semMovimento()) {
    detalhe.style.transition = 'none';
    detalhe.style.clipPath = recorte(origem);
    detalhe.offsetWidth;
    detalhe.style.transition = 'clip-path .45s cubic-bezier(.2,.8,.2,1)';
    detalhe.style.clipPath = 'inset(0px)';
  }
  document.getElementById('voltar').focus({ preventScroll: true });
}

function fechar() {
  if (!casaAberta) return;
  const origem = document.querySelector(`.casa[data-casa="${casaAberta}"]`);
  casaAberta = null;
  const fim = () => { detalhe.hidden = true; detalhe.style.clipPath = ''; origem.focus({ preventScroll: true }); };
  if (semMovimento()) return fim();
  detalhe.style.clipPath = recorte(origem);
  setTimeout(fim, 450);
}

/* =========================================================
   Render: aplica o estado S em toda a página
   ========================================================= */
let arrastando = null;

function render() {
  const $$ = s => document.querySelectorAll(s);
  $$('[data-mk]').forEach(el => {
    const id = el.dataset.mk;
    el.classList.toggle('on', DEV[id].tipo === 'carga' && !!S[id]);
    el.classList.toggle('ativo', DEV[id].tipo === 'sensor' && sensorAtivo(id));
  });
  $$('[data-carga]').forEach(el => el.classList.toggle('on', !!S[el.dataset.carga]));
  $$('[data-sensor]').forEach(el => el.classList.toggle('ativo', sensorAtivo(el.dataset.sensor)));
  $$('[data-estado]').forEach(el => el.textContent = textoEstado(el.dataset.estado));
  $$('[data-valor]').forEach(el => el.textContent = textoValor(el.dataset.valor));
  $$('[data-sub]').forEach(el => el.textContent = textoSub(el.dataset.sub));
  $$('[data-toggle]').forEach(el => el.textContent = textoAcao(el.dataset.toggle));
  $$('[data-set]').forEach(el => el.setAttribute('aria-pressed', String(S[el.dataset.set]) === el.dataset.v));
  $$('[data-auto]').forEach(el => el.checked = !!S[el.dataset.auto]);
  $$('[data-brilho]').forEach(el => el.classList.toggle('on', !!S[el.dataset.brilho]));
  $$('[data-escuridao]').forEach(el => el.style.opacity = ((100 - S.luz) / 100 * 0.6).toFixed(2));
  $$('[data-led]').forEach(el => el.classList.toggle('on', !!S.LG));
  $$('[data-cone]').forEach(el => el.classList.toggle('ativo', carro()));
  $$('[data-carro]').forEach(el => {
    el.setAttribute('transform', `translate(105 ${yCarro()})`);
    el.style.opacity = S.US > 30 ? 0 : (carro() ? 1 : .55);
  });
  $$('[data-ceu]').forEach(el => el.classList.toggle('chuva-on', !!S.CH));
  $$('[data-braco]').forEach(el => el.classList.toggle('on', !!S.VR));
  $$('[data-helice]').forEach(el => el.classList.toggle('on', !!S.VT));
  $$('[data-vs]').forEach(el => {
    const f = FAIXA[el.dataset.vs], v = S[el.dataset.vs];
    const fr = (v - f.min) / (f.max - f.min), fl = (f.lim() - f.min) / (f.max - f.min);
    el.querySelector('.regua-cheio').style.height = (fr * 100) + '%';
    el.querySelector('.regua-cursor').style.bottom = (fr * 100) + '%';
    el.querySelector('.regua-cursor').setAttribute('aria-valuenow', v);
    el.querySelector('.regua-limiar').style.bottom = (fl * 100) + '%';
  });
  $$('[data-sim]').forEach(el => {
    if (el.type === 'checkbox') el.checked = !!S[el.dataset.sim];
    else if (document.activeElement !== el) el.value = S[el.dataset.sim];
  });
  document.getElementById('alerta').classList.toggle('ativo', !!S.FU);
  document.getElementById('alerta-txt').textContent = S.SR ? 'Fumaça detectada. A sirene está tocando.' : 'Fumaça detectada.';
  document.getElementById('alerta-bt').hidden = !S.SR;
}

/* =========================================================
   Comunicação com o ESP32
   GET  /api/estado            -> JSON com o estado S (e "lim" opcional)
   POST /api/set  id=..&v=..   -> aplica e devolve o estado
   Aberta como arquivo local (ou com ?demo) a página simula o ESP32.
   ========================================================= */
let modo = 'conectando', falhas = 0;
const ultimoEnvio = {}, pendente = {}, travado = {};

function definir(id, v, arrastar = false) {
  if (modo === 'demo') { simAplicar(id, v); render(); return; }
  S[id] = v;
  ultimoEnvio[id] = Date.now();
  render();
  if (arrastar) {   // durante o arraste, no máximo ~3 envios por segundo
    if (travado[id]) { pendente[id] = v; return; }
    travado[id] = setTimeout(() => {
      travado[id] = null;
      if (pendente[id] !== undefined) { const p = pendente[id]; delete pendente[id]; enviar(id, p); }
    }, 300);
  }
  enviar(id, v);
}

async function enviar(id, v) {
  try {
    const r = await fetch('/api/set', { method: 'POST', body: new URLSearchParams({ id, v }) });
    if (r.ok) mesclar(await r.json());
  } catch (e) { marcarFalha(); }
}

function mesclar(dados) {
  if (dados.lim) Object.assign(LIM, dados.lim);
  for (const k in S) {
    if (!(k in dados) || k === arrastando) continue;
    if (Date.now() - (ultimoEnvio[k] || 0) < 800) continue;
    S[k] = dados[k];
  }
  render();
}

async function buscar() {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 2500);
  try {
    const r = await fetch('/api/estado', { cache: 'no-store', signal: ctl.signal });
    if (!r.ok) throw new Error(r.status);
    mesclar(await r.json());
    falhas = 0;
    status('online', 'ESP32 conectado');
    return true;
  } catch (e) { marcarFalha(); return false; }
  finally { clearTimeout(t); }
}

function marcarFalha() { if (modo === 'online' && ++falhas >= 3) status('offline', 'Sem resposta do ESP32. Verifique o Wi-Fi.'); }

function status(classe, txt) {
  const p = document.getElementById('conexao');
  p.className = 'conexao ' + classe;
  p.querySelector('span').textContent = txt;
}

async function iniciarConexao() {
  const forcarDemo = location.protocol === 'file:' || new URLSearchParams(location.search).has('demo');
  if (!forcarDemo && await buscar()) {
    modo = 'online';
    setInterval(buscar, 700);
  } else {
    modo = 'demo';
    status('demo', 'Simulação, sem ESP32');
    document.querySelectorAll('[data-abre-sim]').forEach(b => b.hidden = false);
  }
}

/* regras de automação (o firmware aplica as mesmas) */
function condicoes() { return { escuro: escuro(), quente: quente(), carro: carro(), chuva: !!S.CH, fumaca: !!S.FU }; }

let timerSirene = null;

function simAplicar(id, v) {
  const srAntes = S.SR;
  const antes = condicoes();
  S[id] = v;
  const d = condicoes();
  if (S.aLuz && d.escuro !== antes.escuro) S.L1 = S.L2 = S.L3 = +d.escuro;
  if (S.aVent && d.quente !== antes.quente) S.VT = +d.quente;
  if (S.aVaral && d.chuva !== antes.chuva) S.VR = +d.chuva;
  if (S.aGar && d.carro !== antes.carro) S.LG = +d.carro;
  if (S.aSir && d.fumaca !== antes.fumaca) S.SR = +d.fumaca;
  if (v) {
    if (id === 'aLuz') S.L1 = S.L2 = S.L3 = +d.escuro;
    if (id === 'aVent') S.VT = +d.quente;
    if (id === 'aVaral') S.VR = +d.chuva;
    if (id === 'aGar') S.LG = +d.carro;
    if (id === 'aSir') S.SR = +d.fumaca;
  }
  // igual ao firmware: a sirene silencia sozinha após LIM.sirene segundos
  if (S.SR && !srAntes) {
    clearTimeout(timerSirene);
    timerSirene = setTimeout(() => { S.SR = 0; render(); }, LIM.sirene * 1000);
  }
}

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle],[data-set],[data-todas],.casa,#voltar,[data-abre-sim]');
  if (!t) return;
  if (t.matches('.casa')) return abrir(t.dataset.casa, t);
  if (t.id === 'voltar') return fechar();
  if (t.matches('[data-abre-sim]')) { const s = document.getElementById('sim'); s.hidden = !s.hidden; return; }
  if (t.dataset.toggle) return definir(t.dataset.toggle, S[t.dataset.toggle] ? 0 : 1);
  if (t.dataset.set) return definir(t.dataset.set, +t.dataset.v);
  if (t.dataset.todas) ['L1', 'L2', 'L3'].forEach(id => definir(id, +t.dataset.todas));
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.auto) definir(t.dataset.auto, t.checked ? 1 : 0);
  if (t.dataset.sim && t.type === 'checkbox') { simAplicar(t.dataset.sim, t.checked ? 1 : 0); render(); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.sim && t.type === 'range') { simAplicar(t.dataset.sim, +t.value); render(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fechar();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.casa')) { e.preventDefault(); abrir(e.target.dataset.casa, e.target); }
});

function relogio() {
  document.getElementById('relogio').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

desenharPlanta();
desenharCarimbo();
render();
relogio(); setInterval(relogio, 10000);
iniciarConexao();
</script>
